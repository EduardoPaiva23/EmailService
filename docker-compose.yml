services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: email-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      # Sem limite, o SQL Server tenta usar ~80% da memória da VM do Docker
      # e pode esgotar a memória do host, derrubando a VM do WSL.
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: email-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Executa como o usuário rabbitmq: rodando como root, o primeiro
      # healthcheck pode criar o .erlang.cookie antes do servidor, que
      # então falha com eacces ao lê-lo.
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: email-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface web
    restart: unless-stopped

volumes:
  sqlserver_data:
  rabbitmq_data:
